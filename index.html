<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Study App — Claude Certified Architect (Foundations)</title>
<style>
:root{--bg:#f7f6f3;--panel:#ffffff;--ink:#1a1a18;--mut:#6b6a66;--line:#e4e2dc;--acc:#b4541f;--acc2:#8a6f4e;--good:#2e7d43;--bad:#b3372f;--soft:#f0ede7;--nav:#232320;--navink:#d8d6d0;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
#app{display:flex;min-height:100vh}
/* nav */
#nav{width:280px;background:var(--nav);color:var(--navink);padding:18px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
#nav h1{font-size:15px;color:#fff;margin:4px 6px 2px}
#nav .tag{font-size:11px;color:#9a988f;margin:0 6px 12px}
.navitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;border:none;background:none;color:var(--navink);text-align:left;width:100%}
.navitem:hover{background:#33332e}
.navitem.active{background:#3d3c35;color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:#55534b;flex-shrink:0}
.dot.done{background:var(--good)}.dot.part{background:#c9a227}
.navitem .sc{margin-left:auto;font-size:11px;color:#9a988f}
#modeRow{margin:10px 6px 14px;display:flex;border:1px solid #55534b;border-radius:8px;overflow:hidden}
#modeRow button{flex:1;background:none;border:none;color:var(--navink);padding:7px 4px;font-size:12px;cursor:pointer}
#modeRow button.on{background:var(--acc);color:#fff;font-weight:600}
#navprog{margin-top:auto;padding:12px 6px 4px;font-size:11px;color:#9a988f}
.pbar{height:6px;background:#3d3c35;border-radius:3px;margin-top:6px;overflow:hidden}
.pbar>div{height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
/* main */
#main{flex:1;padding:32px 40px;max-width:980px}
h2{font-size:24px;margin-bottom:2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:4px}
.domtag{display:inline-block;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--acc2);margin-bottom:18px}
section{margin-bottom:26px}
.fastbox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:16px 18px;font-size:14.5px}
.fastbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700;margin-bottom:6px}
details.deep{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0}
details.deep summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:14px;color:var(--acc2)}
details.deep .body{padding:2px 18px 16px;font-size:14px}
details.deep .body p{margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--soft)}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:10px}
/* comparisons */
.comp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.comp h4{font-size:13.5px;margin-bottom:10px}
.compcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.compcol{background:var(--soft);border-radius:8px;padding:10px 12px}
.compcol h5{font-size:12.5px;color:var(--acc);margin-bottom:6px}
.compcol ul{padding-left:16px;font-size:12.5px}
.compcol li{margin-bottom:4px}
/* flashcards */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.fcard{perspective:800px;cursor:pointer;min-height:110px}
.fcard .inner{position:relative;width:100%;min-height:110px;transition:transform .4s;transform-style:preserve-3d}
.fcard.flip .inner{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;padding:12px;font-size:12.5px;display:flex;align-items:center;justify-content:center;text-align:center}
.ffront{background:var(--panel);border:1px solid var(--line);font-weight:600}
.fback{background:#2f4437;color:#eaf3ec;transform:rotateY(180deg)}
.hint{font-size:11px;color:var(--mut);margin-bottom:8px}
/* quiz */
.quizbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.qmeta{font-size:11.5px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.qtext{font-size:14.5px;font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--acc2)}
.opt:disabled{cursor:default;opacity:.85}
.opt.right{background:#e5f2e8;border-color:var(--good);opacity:1}
.opt.wrong{background:#f7e5e3;border-color:var(--bad);opacity:1}
.expl{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;display:none}
.expl.show{display:block}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.score{font-size:15px;font-weight:700;margin-bottom:8px}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--acc2)}
.tile h4{font-size:13.5px;margin-bottom:4px}
.tile .st{font-size:12px;color:var(--mut)}
.dombars{margin-top:10px}
.domrow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:6px}
.domrow .nm{width:230px}
.domrow .bar{flex:1;height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.domrow .bar>div{height:100%;border-radius:5px}
.linkrow a{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12.5px;color:var(--acc2);text-decoration:none;margin:0 8px 8px 0}
.linkrow a:hover{border-color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
/* progress & sync */
.syncrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.syncrow .btn{font-size:13px;padding:8px 14px}
.syncrow label.btn{display:inline-block;line-height:1.2}
#syncOut,#importText{width:100%;min-height:120px;margin-top:12px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45;background:var(--soft);color:var(--ink);resize:vertical}
.syncmsg{font-size:12.5px;font-weight:600;margin-top:8px}
.syncmsg.ok{color:var(--good)}.syncmsg.err{color:var(--bad)}
@media(max-width:860px){#app{flex-direction:column}#nav{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}#nav h1,#nav .tag{width:100%}.navitem{width:auto}#navprog{display:none}#main{padding:20px 16px}}
</style>
</head>
<body>
<div id="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const QBANK = {"a1": [{"q": "As of mid-2026, which model is the balanced default tier on Claude and Claude Code (with intro pricing through Aug 31, 2026)?", "opts": ["Opus 4.8", "Sonnet 5", "Haiku 4.5", "Fable 5"], "ans": 1, "exp": "Sonnet 5 is the balanced default on Claude/Claude Code seats (intro pricing through Aug 31, 2026); API docs now point to Opus 5 (general starting point, since Jul 24, 2026) or Fable 5 (max capability); Haiku 4.5 for speed/cost."}, {"q": "Adaptive thinking differs from classic extended thinking in that it:", "opts": ["is model-managed and always on for the newest flagship tier", "must be enabled per request with a token budget", "only works with tool use", "is a Claude Code-only feature"], "ans": 0, "exp": "Adaptive thinking is model-managed and always on for Fable 5; classic extended thinking used a per-request token budget (still the mechanism on Haiku 4.5)."}, {"q": "The `effort` parameter controls:", "opts": ["max output tokens", "how much reasoning depth the model applies, defaulting to high", "API rate limits", "tool-call parallelism"], "ans": 1, "exp": "`effort` controls reasoning depth; defaults to high on current models (Opus 5, Opus 4.8, Sonnet 5)."}, {"q": "A client needs to process 500-page contracts in a single request. Your first architectural check is:", "opts": ["fine-tuning availability", "GPU quota", "model context-window size vs. document token count", "embeddings dimensionality"], "ans": 2, "exp": "Fit the document within the context window first; everything else follows."}, {"q": "Which pairing is correct?", "opts": ["Haiku 4.5 — highest capability", "Sonnet 5 — balanced default for production dev", "Fable 5 — cheapest", "Opus 4.8 — smallest context window"], "ans": 1, "exp": "Correct: Sonnet 5 — balanced default for production dev"}], "a2": [{"q": "The primary reason to use XML tags in prompts for Claude is:", "opts": ["required syntax", "unambiguous separation of instructions, context, and examples", "faster inference", "lower cost"], "ans": 1, "exp": "Tags disambiguate prompt parts; Claude is specifically trained to attend to XML structure."}, {"q": "Few-shot examples are most valuable when:", "opts": ["you need consistent format/style/edge-case handling", "the task is open-ended creative writing", "the prompt is short", "using tools"], "ans": 0, "exp": "Few-shot shines for format consistency and edge-case behavior."}, {"q": "On models that still support prefill (e.g., Haiku 4.5 with thinking off — current flagship models reject assistant prefill outright), prefilling is used to:", "opts": ["constrain the start of the response (e.g., force JSON by prefilling `{`)", "cache the prompt", "enable streaming", "raise the context limit"], "ans": 0, "exp": "Prefill constrains the response start (classic trick: prefill `{` to force JSON) — note current flagship models (Fable 5, Opus 5, Opus 4.8, Sonnet 5) reject assistant prefill unconditionally; it works only on Haiku 4.5-class models with thinking off."}, {"q": "For a multi-stage analysis (extract → classify → summarize), the docs recommend:", "opts": ["one mega-prompt", "fine-tuning", "chaining prompts, passing outputs between stages", "raising temperature"], "ans": 2, "exp": "Prompt chaining: decompose, pass artifacts between stages."}, {"q": "In long-context prompts, where should longform reference documents generally go?", "opts": ["near the top, above instructions/query", "after the question", "in the system prompt only", "split across turns"], "ans": 0, "exp": "Long documents near the top, instructions/query after them, per long-context tips."}], "a3": [{"q": "Structured outputs guarantee:", "opts": ["output conforming to your JSON schema", "factual accuracy", "lower latency always", "deterministic text"], "ans": 0, "exp": "Schema conformance, not truthfulness."}, {"q": "Prompt caching saves cost when:", "opts": ["every request is unique", "using streaming", "responses are short", "a large stable prefix (system prompt/docs/tools) repeats across requests"], "ans": 3, "exp": "Caching pays off on repeated stable prefixes."}, {"q": "`stop_reason: \"tool_use\"` means:", "opts": ["an error", "content was filtered", "max tokens hit", "Claude is requesting a tool call and awaits your tool result"], "ans": 3, "exp": "The app must run the tool and return a tool_result."}, {"q": "Batch API's headline trade-off is:", "opts": ["+cost for +speed", "bigger context", "−50% cost for async (non-realtime) processing", "no rate limits"], "ans": 2, "exp": "50% discount for async batch workloads."}, {"q": "Changing your structured-output schema between calls matters for caching because:", "opts": ["nothing changes", "schemas are never cached", "caching only covers images", "it can invalidate the cached prefix (schema affects the effective prompt)"], "ans": 3, "exp": "The schema is part of the effective prompt; changing it can invalidate cache."}], "a4": [{"q": "The single highest-leverage factor in whether Claude uses a tool correctly is:", "opts": ["a precise description + parameter schema", "tool name length", "temperature", "model size"], "ans": 0, "exp": "Description + schema quality dominate tool-selection accuracy."}, {"q": "In the tool-use loop, after receiving `tool_use`, your app must:", "opts": ["re-send the same request", "nothing", "call a webhook", "execute the tool and return a `tool_result` block in the next user turn"], "ans": 3, "exp": "Correct: execute the tool and return a `tool_result` block in the next user turn"}, {"q": "Programmatic tool calling means:", "opts": ["tools defined in YAML", "manual orchestration", "tools call other tools", "Claude writes code in a sandbox that invokes tools, reducing round-trips/tokens"], "ans": 3, "exp": "Claude authors sandboxed code that calls tools programmatically, cutting round-trips and token overhead."}, {"q": "The tool search tool solves:", "opts": ["slow tools", "rate limits", "authentication", "exposing thousands of tools without loading all schemas into context"], "ans": 3, "exp": "On-demand discovery (regex/BM25 variants) over large tool catalogs without preloading all schemas."}, {"q": "`tool_choice` can be used to:", "opts": ["rename tools", "force Claude to use a specific tool", "cache tools", "parallelize tools"], "ans": 1, "exp": "`tool_choice` can force a specific tool (or any/auto/none)."}], "a5": [{"q": "MCP's three core server primitives are:", "opts": ["models, chains, agents", "GET, POST, PUT", "tools, resources, prompts", "skills, hooks, subagents"], "ans": 2, "exp": "Tools, resources, prompts."}, {"q": "MCP exists (vs. bespoke tool integrations) to:", "opts": ["standardize how any client app connects models to tools/data — build once, use in many clients", "replace REST", "speed inference", "replace embeddings"], "ans": 0, "exp": "N×M integrations become N+M: build a server once, any MCP client uses it."}, {"q": "An MCP *resource* differs from a *tool* in that a resource:", "opts": ["executes actions", "is Claude-only", "exposes readable data/context, typically application-controlled rather than model-invoked", "requires OAuth"], "ans": 2, "exp": "Resources expose data/context; tools execute model-invoked actions."}, {"q": "Which is a typical MCP transport pairing?", "opts": ["WebRTC", "FTP/SMTP", "gRPC only", "stdio for local servers; streamable HTTP for remote"], "ans": 3, "exp": "stdio locally; streamable HTTP for remote servers."}, {"q": "A client has data in Postgres, Slack, and GitHub and wants Claude Code + Claude Desktop + a custom app to access them. Best pattern:", "opts": ["three bespoke integrations per app (9 builds)", "copy data into prompts", "MCP servers per system, reused by all MCP clients", "fine-tune per source"], "ans": 2, "exp": "Correct: MCP servers per system, reused by all MCP clients"}], "a6": [{"q": "CLAUDE.md is best described as:", "opts": ["a config for API keys", "a changelog", "persistent project instructions/conventions Claude Code loads as memory", "a lockfile"], "ans": 2, "exp": "Persistent project memory/instructions, loaded hierarchically (enterprise → user → project)."}, {"q": "Plan mode is for:", "opts": ["faster edits", "having Claude propose an implementation plan for review before touching code", "CI only", "formatting"], "ans": 1, "exp": "Propose and review a plan before execution."}, {"q": "Claude Code hooks let you:", "opts": ["run your own commands/gates at lifecycle events (e.g., pre/post tool use)", "change models mid-task", "edit the system prompt", "add GPUs"], "ans": 0, "exp": "Lifecycle event gates (PreToolUse, PostToolUse, Stop, PreCompact, etc.)."}, {"q": "Subagents in Claude Code are useful because they:", "opts": ["are cheaper always", "run on-device", "skip permissions", "isolate scoped tasks with their own context window, keeping the main context clean"], "ans": 3, "exp": "Context isolation for scoped tasks; results return to the lead context."}, {"q": "Relative to an autocomplete-style AI IDE, Claude Code's distinctive workflow is:", "opts": ["inline tab completion", "delegated agentic tasks: explore → plan → execute → verify with checkpoints/permissions", "syntax highlighting", "pair programming voice mode"], "ans": 1, "exp": "Delegated agentic tasks vs. inline completion is the paradigm difference vs. Cursor-style flow."}], "a7": [{"q": "Anthropic's core distinction: workflows are ___, agents are ___.", "opts": ["cheap / expensive", "single / multimodel", "local / cloud", "predefined orchestration paths / model-directed dynamic control of process and tools"], "ans": 3, "exp": "The workflows-vs-agents distinction from Building Effective AI Agents."}, {"q": "Anthropic's first advice on agents is:", "opts": ["always use multi-agent", "fine-tune first", "find the simplest solution — many problems need a single well-prompted LLM call or simple workflow, not an agent", "start with 10 tools"], "ans": 2, "exp": "Simplest thing that works; agents only when needed."}, {"q": "The orchestrator-workers pattern fits when:", "opts": ["tasks are fully predictable", "subtasks can't be predicted upfront and a lead agent should decompose/delegate", "latency must be minimal", "no tools exist"], "ans": 1, "exp": "Orchestrator decomposes and delegates when subtasks aren't predictable upfront."}, {"q": "\"Context engineering\" reframes prompt engineering as:", "opts": ["curating everything in the finite context — instructions, tools, history, retrieved data — for signal over noise", "writing longer prompts", "GPU management", "prompt compression only"], "ans": 0, "exp": "Curate the whole context: instructions, tools, history, retrievals."}, {"q": "Compaction (summarize-and-continue) is needed because:", "opts": ["APIs time out", "models forget between API calls anyway", "tokens are free", "long-running agents accumulate history that exceeds/degrades the context window"], "ans": 3, "exp": "History growth degrades quality and overflows the window; compaction summarizes and continues."}], "a8": [{"q": "The most reliable hallucination mitigation for factual client work is:", "opts": ["temperature 0", "grounding in provided/retrieved source material and allowing \"I don't know\"", "longer prompts", "bigger model only"], "ans": 1, "exp": "Grounding + permission to say \"I don't know\" beat parameter tweaks."}, {"q": "Prompt injection risk is highest when:", "opts": ["users type questions", "using JSON", "untrusted external content (web pages, emails, docs) enters the context of a tool-using agent", "short prompts"], "ans": 2, "exp": "Untrusted content in an agent's context is the injection vector."}, {"q": "A good eval suite is built:", "opts": ["after launch", "only manually", "from defined success criteria, before/alongside development, run continuously", "once"], "ans": 2, "exp": "Criteria → test cases → continuous evals."}, {"q": "An agent that verifies its own outputs against a rubric before finalizing is an example of:", "opts": ["evaluator/self-grading loop patterns", "fine-tuning", "caching", "RAG"], "ans": 0, "exp": "Evaluator-optimizer / outcome-grader loop."}, {"q": "For a client in a regulated industry, usage-policy review happens:", "opts": ["never", "at solution design time, as an architect responsibility", "after launch", "only by legal"], "ans": 1, "exp": "Policy fit is a design-time architect responsibility."}], "b1": [{"q": "Which model still uses classic extended thinking with a per-request token budget (as of mid-2026)?", "opts": ["Fable 5", "Sonnet 5", "Haiku 4.5", "Opus 4.8"], "ans": 2, "exp": "Correct: Haiku 4.5"}, {"q": "A client needs lowest latency and cost for simple high-volume classification. Best default:", "opts": ["Haiku 4.5", "Opus 4.8", "Fable 5", "Sonnet 5 with effort high"], "ans": 0, "exp": "Correct: Haiku 4.5"}, {"q": "The context window limits:", "opts": ["output tokens only", "total tokens attended to per request — input (incl. tools/history) plus output", "training data recency", "number of tool calls"], "ans": 1, "exp": "Correct: total tokens attended to per request — input (incl. tools/history) plus output"}, {"q": "On Opus 4.8/Sonnet 5, dialing reasoning depth down for speed uses:", "opts": ["temperature", "top_k", "max_tokens only", "the effort parameter"], "ans": 3, "exp": "Correct: the effort parameter"}, {"q": "Which statement about the mid-2026 lineup is TRUE?", "opts": ["Fable 5 is the flagship tier above Opus", "Sonnet 5 is deprecated", "Haiku 4.5 has the largest context window", "Opus 4.8 is the cheapest model"], "ans": 0, "exp": "Correct: Fable 5 is the flagship tier above Opus"}], "b2": [{"q": "\"You are a senior tax auditor reviewing filings…\" is which technique?", "opts": ["prefill", "role prompting", "chain-of-thought", "few-shot"], "ans": 1, "exp": "Correct: role prompting"}, {"q": "Claude keeps adding chatty preamble before JSON output (non-structured-output path, on an older model such as Haiku 4.5 with thinking off). The classic quick fix:", "opts": ["prefill the assistant turn wit {id:'prompting', title:'2. Prompt Engineering', sub:'Techniques · when each earns its keep', dom:'Exam: D4 (20%)',
fast:'The technique hierarchy: be clear/direct → few-shot examples → chain-of-thought → XML tags → role → chaining. Few-shot fixes format/edge-case inconsistency; CoT helps multi-step reasoning; XML tags separate instructions from data; chaining beats mega-prompts when stages have distinct success criteria. Long documents go NEAR THE TOP, instructions/question after. Prefill is legacy: current flagship models reject it outright.',
deep:`<p><b>Match the lever to the failure mode.</b> Inconsistent format across similar inputs → few-shot examples. Weak multi-step reasoning → chain-of-thought (think in tags before answering). Model confuses instructions with reference text → XML-tag the sections (Claude is specifically trained on XML structure). Wrong persona/register → role prompting. A pipeline with distinct stages (extract → classify → summarize) → prompt chaining, validating intermediate outputs between stages.</p>
<p><b>Long-context ordering:</b> put longform documents near the top, instructions and query after them.</p>
<p><b>Prefill is now legacy.</b> Prefilling the assistant turn (classic trick: prefill <code>{</code> to force JSON) is unconditionally rejected (400) on Fable 5, Opus 5, Opus 4.8 and Sonnet 5. It survives only on Haiku-class and older models with thinking off. For guaranteed JSON, use structured outputs (API module).</p>
<p><b>Consultant note:</b> Cursor-style casual prompting is the habit to unlearn — the exam asks "choose the BEST prompt improvement" among plausible options, so know why each technique wins.</p>`,

{id:'tools', title:'3. Tool Use', sub:'The loop · scaling features', dom:'Exam: D2 (18%)',
fast:'Tool quality = description + schema quality; that single factor dominates whether Claude picks and uses tools correctly. The loop: stop_reason "tool_use" → your app executes → return tool_result (is_error:true for failures, with an informative message so Claude self-corrects). Parallel calls for independent reads. tool_choice: auto (may answer directly) / any (must use some tool) / tool (forced specific). Scaling: programmatic tool calling (Claude writes sandboxed code invoking tools — fewer round-trips) and the tool search tool (regex/BM25 discovery over huge catalogs).',
deep:`<p><b>Design tools like prompts.</b> A good API endpoint is not a good tool: wrap a 30-param CRM search into an opinionated, natural-language-friendly tool with few parameters, sane defaults, and informative errors. Side-effecting tools (issue_refund) need strict schemas, idempotency keys, and human-confirmation gating enforced app-side — the app intercepts the tool call above a threshold and requires approval before returning tool_result.</p>
<p><b>The loop mechanics.</b> Claude returns stop_reason "tool_use" → you execute → next user turn carries a tool_result block. Failures go back as tool_result with is_error:true and a descriptive message (e.g., suggest the alternate ID format) so Claude can adapt and retry. Independent reads can be requested as parallel tool calls in one assistant turn; never parallelize calls that mutate shared state.</p>
<p><b>2026 scaling features.</b> <i>Programmatic tool calling:</i> Claude writes code in a sandboxed execution container that invokes your tools — big win for bulk/iterative operations that would otherwise mean many model round-trips and huge intermediate results in context. <i>Tool search tool:</i> ships two variants — regex and BM25 (keyword) — letting Claude discover tools on demand from catalogs of hundreds without preloading every schema into context (embeddings-based search requires a custom implementation). A tool returning 50k tokens of raw rows harms the loop: design bounded outputs (summaries, pagination, filters).</p>`,
comps:[
{title:'Plain tool loop vs Programmatic tool calling', cols:[
{h:'Plain loop', pts:['One round-trip per tool call','Results land in context each time','Fine for a handful of calls']},
{h:'Programmatic (PTC)', pts:['Claude writes sandboxed code that calls tools','Bulk/iterative operations, one round-trip','Intermediate results stay out of context']}]},

{id:'mcp', title:'4. MCP & Connectors', sub:'Primitives · transports · 3 meanings of "connector"', dom:'Exam: D2 (18%)',
fast:'MCP turns N×M bespoke integrations into N+M: build a server once, every MCP client (Claude Code, Desktop, custom apps) reuses it. Server primitives: TOOLS (model-invoked actions), RESOURCES (readable data/context), PROMPTS (reusable templates). Transports: stdio (local process) and streamable HTTP (remote/shared). Know the three senses of "connector": MCP server (protocol program) ≠ MCP connector (Messages API feature calling remote servers directly) ≠ Connectors directory (claude.com/connectors consumer marketplace).',
deep:`<p><b>Why MCP exists.</b> An enterprise with 12 systems and 4 Claude surfaces faces 48 bespoke integrations; with MCP it builds 12 servers that all clients share — plus a standard governance/audit point. That reuse argument is the predictable exam angle.</p>
<p><b>Primitives.</b> Tools = actions the model invokes (create_ticket). Resources = readable data the application exposes as context (a KB folder, project docs) — NOT model-invoked actions. Prompts = user-invokable templates a server offers. The docs now also describe client-side primitives (sampling, elicitation, logging) and an experimental Tasks primitive.</p>
<p><b>Transports.</b> stdio for a local process during development or desktop use; streamable HTTP for remote/shared servers with auth for enterprise deployment.</p>
<p><b>Three "connector" senses (commonly confused):</b> (1) an <i>MCP server</i> is the protocol-level program; (2) the <i>MCP connector</i> is a Messages API feature (mcp_servers param, beta header) letting the API call a REMOTE MCP server directly without your own client — tool calls only, no stdio; (3) <i>Connectors</i> (claude.com/connectors) is the consumer directory of pre-built integrations users one-click connect — a product wrapper around MCP servers.</p>
<p><b>MCP vs direct API tool use:</b> same tools conceptually, different plumbing — direct tool use lives inside one app's request loop; MCP externalizes tools for reuse across many clients. Single bespoke app → direct tools are fine. Many surfaces/systems → MCP. Bulk data pipeline → programmatic tool calling.</p>`,

{title:'Resource vs Tool (MCP)', cols:[
{h:'Resource', pts:['Readable data/context','Application-controlled exposure','KB articles, docs folder','No side effects']},

{id:'claudecode', title:'5. Claude Code', sub:'CLAUDE.md · skills · hooks · subagents', dom:'Exam: D3 (20%)',
fast:'Four steering levers, one rule of thumb: conventions → CLAUDE.md · procedures → skills · guarantees → hooks · isolation → subagents. CLAUDE.md loads hierarchically (managed policy → user → project → local, plus .claude/rules/). Skills replace slash commands for new procedures (slash commands still work but are marked legacy). Hooks are deterministic lifecycle gates (PreToolUse, PostToolUse, Stop, PreCompact…). Subagents get their own context window + scoped tools. Plan mode for high-risk work; headless mode (claude -p) for CI/GitHub Actions.',
deep:`<p><b>The exam’s favorite question is lever placement.</b> "Never edit /payments/**" is a GUARANTEE → PreToolUse hook or permission deny rule, never CLAUDE.md prose. A 7-step weekly release procedure → a skill (on-demand, progressive disclosure). Team conventions loading every session → checked-in project CLAUDE.md + .claude/rules/. A 200k-token test log you need conclusions from → a subagent processes it and returns a summary, keeping the lead context clean.</p>
<p><b>Memory hierarchy.</b> Managed/enterprise policy → user (~/.claude/CLAUDE.md) → project (./CLAUDE.md) → local (CLAUDE.local.md), composing top-down; granular rules in .claude/rules/. This is also the onboarding artifact — juniors give Claude project context via a rich CLAUDE.md, not by pasting the repo into chat.</p>
<p><b>Skills vs slash commands.</b> Docs now mark .claude/commands/ as the LEGACY format; Skills (.claude/skills/name/SKILL.md) are recommended for new procedures — richer structure, progressive disclosure, shareable via repos/plugins. Legacy commands keep working.</p>
<p><b>Workflow discipline.</b> Plan mode → human reviews the approach → execute → verify with tests, for multi-file/high-risk/unfamiliar work; direct execution for small well-understood edits. Subagents (e.g., a read-only security-reviewer) carry role-scoped tools and their own focused prompt. Headless mode runs Claude Code non-interactively with scoped permissions — the mechanism for automated PR review in GitHub Actions. Newer surfaces worth knowing exist: auto memory, Routines (scheduled cloud runs), background agents.</p>`,

{id:'agents', title:'6. Agents & Context', sub:'Patterns · orchestration · context engineering', dom:'Exam: D1 (27%) + D5 (15%) — biggest slice',
fast:'Workflows = predefined orchestration paths; agents = the model dynamically directs its own process and tools. Anthropic’s first rule: find the SIMPLEST solution — many problems need one well-prompted (augmented) call, not an agent. Pattern ladder: augmented call → chaining → routing → parallelization → orchestrator-workers → evaluator-optimizer → autonomous agents. Context is a finite curated resource: compaction, subagent isolation, file-based note-taking, memory tool, context editing. Reliability = retries, checkpoints, self-verification, human gates.',
deep:`<p><b>The augmented LLM</b> (one call + retrieval/tools/memory) is the basic building block. Climb the ladder only when justified by task value and the failure of simpler rungs, weighed against cost, latency and error risk. Fixed pipeline stages (fetch → extract → validate → load) = a workflow; unpredictable decomposition per input = orchestrator-workers, where a lead agent delegates to workers. Overstated synthesis = add an evaluator-optimizer loop (grade against criteria, revise). Hybrid designs are the norm: workflow for the predictable path, an agent only where dynamic judgment is needed.</p>
<p><b>Loop mechanics.</b> In the raw API the agentic loop is stop_reason-driven ("tool_use" → execute → continue). The Agent SDK (Python/TS) packages loop + tools + context management, with subagents, hooks (PreToolUse etc.) and session resume/forking — fork one checkpoint to explore two fix strategies. Claude Code is the interactive surface; Managed Agents the hosted one.</p>
<p><b>Context engineering.</b> Long-running agents degrade as history accumulates: compact (summarize-and-continue, preserving critical state via PreCompact), isolate heavy exploration in subagents that return distilled findings, write intermediate results to files (structured note-taking / filesystem as external memory), persist cross-session state with the memory tool, and clear stale tool results with context editing. Caching interplays with all of it.</p>
<p><b>Reliability checklist (D5):</b> retry with backoff → flagged partial results beat crashes; checkpoint state to files/git so a fresh session resumes after a kill; add a final self-verification pass against success criteria; put humans at side-effect gates.</p>`,

{id:'api', title:'7. API Mechanics', sub:'Structured outputs · caching · batch · stop reasons', dom:'Exam: D4, D5',
fast:'The Messages API is stateless — your client resends prior turns. stop_reason tells you what happened: end_turn, max_tokens (truncation! detect + retry), tool_use. Structured outputs guarantee schema conformance via constrained decoding; changing the schema can invalidate the prompt cache. Caching pays when a large stable prefix repeats (look for cache_read_input_tokens); Batch API = −50% for async work — and the discounts STACK.',
deep:`<p><b>Statelessness.</b> Multi-turn = client resends history each call. Streaming is a UX choice (tokens as generated), not a cost lever.</p>
<p><b>Stop reasons drive control flow.</b> end_turn = done; max_tokens = truncated output (invalid JSON risk — detect and retry with higher limits or a tighter schema); tool_use = execute tools and continue the loop.</p>
<p><b>Structured outputs.</b> Schema conformance guaranteed at generation time (constrained decoding) — conformance, not truthfulness. The schema is part of the effective prompt: changing it invalidates the cache. Param note: output_format → output_config.format (old form transitional). For reasoning-heavy extraction, chain: analysis pass → structured formatting pass.</p>
<p><b>Caching.</b> Cache the large stable prefix (system prompt, docs, tools); verify hits via usage.cache_read_input_tokens. Any change to the prefix — including tool definitions or schema — invalidates it. Opus 5 lowered the cache minimum to 512 tokens.</p>
<p><b>Batch.</b> Flat −50% on input AND output for async workloads (all current models incl. Opus 5). The exam-favorite stack: latency-tolerant, high-volume, repeated prefix → caching + batch together (e.g., nightly extraction over 50k contracts).</p>`,

{id:'guardrails', title:'8. Guardrails & Responsible AI', sub:'Hallucination · injection · evals · policy', dom:'Exam: D5 + professional practice',
fast:'Hallucination: ground answers in provided/retrieved sources and explicitly permit "I don’t know" — beats parameter tweaks. Injection: the vector is UNTRUSTED CONTENT entering a tool-using agent’s context (webpages, tickets, docs) — mitigate in layers: demarcate untrusted content as data, scope tool permissions app-side, screen inbound content. Never "trust the model" as a layer. Evals: define success criteria BEFORE building, encode as test cases, run continuously. Usage-policy fit is a design-time architect responsibility.',
deep:`<p><b>Layered injection defense</b> (the mock’s hostile-ticket scenario): (1) demarcate untrusted content with tags and instruct Claude to treat it as data; (2) enforce hard limits app-side — tool-permission scoping, refund caps, human gates on side effects; (3) screening passes on inbound content; (4) in extraction pipelines, constrain output schema and give the extraction stage no side-effecting tools. Model alignment is not a mitigation layer.</p>
<p><b>Hallucination control</b> for factual client work: retrieve and provide sources, require citations, allow explicit declining ("if not covered by the KB, say so and escalate"), add few-shot examples of declining.</p>
<p><b>Evals as institution.</b> Success criteria → labeled golden set → programmatic scoring → run on every change (models and sources drift). Self-verification (agent grades its own output against a rubric before finalizing) trades tokens/latency for reliability — the evaluator/outcome-grader pattern.</p>
<p><b>Policy.</b> For regulated/high-risk client use cases, check Anthropic’s Usage Policy and the client’s compliance requirements at solution-design time — an architect responsibility, not a post-launch legal cleanup.</p>`,

{id:'thinking', title:'9. Thinking Modes', sub:'Directing how LLMs (and teams) think', dom:'Applied D1/D4 — Week 1 Days 4–5 material',
fast:'Mode choice is an architecture decision. Four families: ANALYTICAL (critical, decomposition, first-principles, computational, probabilistic, hypothesis-driven) · GENERATIVE (blue-sky, lateral, design, analogical) · INTEGRATIVE (systems, strategic, convergent, metacognitive) · ADVERSARIAL (red-team, inversion, socratic). Each maps to a prompt pattern AND an agent role: evaluator-optimizer = critical thinking institutionalized; worker fan-out = divergent; synthesis = convergent; hooks/gates = inversion made executable.',
deep:`<p><b>Same problem, different modes, radically different outputs.</b> "Client churn is rising" analyzed via decomposition (MECE the drivers), blue-sky (20 ideas, no filtering), systems (map feedback loops), inversion (write the post-mortem of the failed retention program) yields four different deliverables — the architect picks the sequence.</p>
<p><b>Key discriminators the pack drills:</b> blue-sky vs lateral (unconstrained volume vs sideways jumps via provocation/analogy) · critical vs red-team (critique the reasoning vs attack the system) · divergent vs convergent (always SEPARATE passes — judgment suppresses generation if merged) · inversion = pre-mortem ("how would we guarantee failure?") turned into executable guardrails · socratic = Claude asks YOU the 5 highest-leverage questions · hypothesis-driven consulting = hypothesis scratchpad → targeted tool calls to confirm/refute → revise.</p>
<p><b>Six Thinking Hats as agent roles:</b> White = facts/research agent · Black = critic · Green = generative · Yellow = advocate · Red = stakeholder sentiment · Blue = orchestrator. A multi-agent system is a team wearing different hats on purpose. Wrong-mode failure ("confident garbage") is caught by an explicit critical/evaluation pass with criteria.</p>`,

const DOMNAMES = {D1:'Agentic Architecture & Orchestration (27%)',D2:'Tool Design & MCP (18%)',D3:'Claude Code (20%)',D4:'Prompting & Structured Output (20%)',D5:'Context & Reliability (15%)'};
const state = {mode:'fast', view:'dash', visited:{}, best:{}, chBest:{}, mockDomains:null, quiz:null};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- saved progress: localStorage (this device) + export/import (across devices) ---------- */
const LSKEY='cca-study-progress-v1', APPID='cca-study-app', PVER=1;
const MODIDS=MODULES.map(m=>m.id);
let syncMsg='', syncOk=true, lastSaved=null;
function snapshot(){ return {app:APPID, v:PVER, savedAt:new Date().toISOString(), mode:state.mode, visited:state.visited, best:state.best, chBest:state.chBest, mockDomains:state.mockDomains}; }
function save(){
  const snap=snapshot();
  try{ localStorage.setItem(LSKEY, JSON.stringify(snap)); lastSaved=snap.savedAt; return true; }
  catch(e){ console.warn('Progress save failed:', e); syncMsg='Could not save in this browser (private mode or storage full) — export your JSON to keep it.'; syncOk=false; return false; }
}
function validateProgress(o){
  const isObj=x=> !!x && typeof x==='object' && !Array.isArray(x);
  if(!isObj(o)) return {ok:false, err:'that is not a progress object.'};
  if(o.app!==undefined && o.app!==APPID) return {ok:false, err:'that JSON is not CCA Study App progress.'};
  if(o.v!==undefined && o.v!==PVER) return {ok:false, err:'unsupported progress version ('+String(o.v).slice(0,20)+').'};
  const scores=src=>{ const out={}; if(isObj(src)) for(const k of Object.keys(src)){ const v=src[k]; if(MODIDS.indexOf(k)>=0 && typeof v==='number' && isFinite(v) && v>=0 && v<=100) out[k]=Math.round(v); } return out; };
  const visited={}; if(isObj(o.visited)) for(const k of Object.keys(o.visited)){ if(MODIDS.indexOf(k)>=0 && o.visited[k]===true) visited[k]=true; }
  let md=null;
  if(isObj(o.mockDomains)){
    const tmp={}; let good=true;
    for(const d of ['D1','D2','D3','D4','D5']){ const r=o.mockDomains[d];
      if(!isObj(r) || typeof r.c!=='number' || typeof r.t!=='number' || !isFinite(r.c) || !isFinite(r.t) || r.t<=0 || r.c<0 || r.c>r.t){ good=false; break; }
      tmp[d]={c:Math.round(r.c), t:Math.round(r.t)};
    }
    if(good) md=tmp;
  }
  const data={mode:(o.mode==='deep'?'deep':'fast'), visited:visited, best:scores(o.best), chBest:scores(o.chBest), mockDomains:md};
  if(!Object.keys(visited).length && !Object.keys(data.best).length && !Object.keys(data.chBest).length && !md) return {ok:false, err:'no recognizable progress found in that JSON.'};
  return {ok:true, data:data};
}
function applyProgress(d){ state.mode=d.mode; state.visited=d.visited; state.best=d.best; state.chBest=d.chBest; state.mockDomains=d.mockDomains; }
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(LSKEY); }catch(e){ console.warn('Progress load failed:', e); return; }
  if(!raw) return;
  let o=null; try{ o=JSON.parse(raw); }catch(e){ console.warn('Stored progress is not valid JSON; ignoring.'); return; }
  const r=validateProgress(o);
  if(r.ok){ applyProgress(r.data); lastSaved=(typeof o.savedAt==='string')? o.savedAt : null; }
  else console.warn('Stored progress rejected:', r.err);
}
function progressJSON(){ return JSON.stringify(snapshot(), null, 2); }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }
function setMsg(t, ok){ syncMsg=t; syncOk=ok!==false; }
function exportDownload(){
  const txt=progressJSON(), name='cca-progress-'+stamp()+'.json';
  try{
    const blob=new Blob([txt],{type:'application/json'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    setMsg('Exported '+name+' — import that file on your other device.');
    render();
  }catch(e){ setMsg('Download blocked in this browser — showing the JSON instead, copy it manually.', false); exportShow(); }
}
function exportCopy(){
  const txt=progressJSON();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ setMsg('Progress JSON copied to clipboard.'); render(); }).catch(exportShow);
  } else exportShow();
}
function exportShow(){
  setMsg('Select all the text below, copy it, then paste it into Import on your other device.');
  render();
  const ta=document.getElementById('syncOut');
  if(ta){ ta.style.display='block'; ta.value=progressJSON(); ta.focus(); ta.select(); }
}
function toggleImport(){
  const b=document.getElementById('importBox');
  if(b) b.style.display = (b.style.display==='block') ? 'none' : 'block';
}
function importError(msg, txt){
  setMsg('Import failed — '+msg, false);
  if(state.view!=='dash'){ state.view='dash'; renderNav(); }
  render();
  const b=document.getElementById('importBox'); if(b) b.style.display='block';
  const ta=document.getElementById('importText'); if(ta) ta.value=txt;
}
function doImport(txt){
  let o=null;
  try{ o=JSON.parse(txt); }catch(e){ importError('that is not valid JSON.', txt); return; }
  const r=validateProgress(o);
  if(!r.ok){ importError(r.err, txt); return; }
  applyProgress(r.data);
  save();
  const nb=Object.keys(r.data.best).length, nv=Object.keys(r.data.visited).length;
  setMsg('Progress imported — '+nb+' quiz score(s), '+nv+' module(s) visited'+(r.data.mockDomains?', mock diagnostics restored':'')+'.');
  state.view='dash'; state.quiz=null; renderNav(); render();
}
function importFromText(){ const ta=document.getElementById('importText'); doImport(ta? ta.value : ''); }
function importFromFile(ev){
  const f=ev.target.files && ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){ doImport(String(rd.result)); };
  rd.onerror=function(){ setMsg('Could not read that file.', false); render(); };
  rd.readAsText(f);
}
function resetProgress(){
  if(!window.confirm('Erase all saved progress on this device? Export first if you want a backup.')) return;
  state.visited={}; state.best={}; state.chBest={}; state.mockDomains=null; state.quiz=null;
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  lastSaved=null; setMsg('Progress cleared on this device.');
  state.view='dash'; renderNav(); render();
}
function savedLabel(){
  if(!lastSaved) return 'Nothing saved yet — progress is stored as soon as you open a module or finish a quiz.';
  const d=new Date(lastSaved); return isNaN(d.getTime())? 'Saved on this device.' : 'Last saved '+d.toLocaleString()+'.';
}
function syncHTML(){
  let h='<section><h3 class="sec">Progress &amp; sync</h3><div class="quizbox">';
  h+='<div style="font-size:13.5px">Modules read, best quiz scores and mock diagnostics are saved automatically in <b>this browser on this device</b> — they survive reloads and closing the tab. To carry progress between your iPhone and your laptop, <b>export</b> here and <b>import</b> there.</div>';
  h+='<div class="note">'+esc(savedLabel())+'</div>';
  if(syncMsg) h+='<div class="syncmsg '+(syncOk?'ok':'err')+'">'+esc(syncMsg)+'</div>';
  h+='<div class="syncrow">';
  h+='<button class="btn" onclick="exportDownload()">Export progress (.json)</button>';
  h+='<button class="btn ghost" onclick="exportCopy()">Copy JSON</button>';
  h+='<button class="btn ghost" onclick="exportShow()">Show JSON</button>';
  h+='<button class="btn ghost" onclick="toggleImport()">Import progress</button>';
  h+='<button class="btn ghost" onclick="resetProgress()">Reset</button>';
  h+='</div>';
  h+='<textarea id="syncOut" readonly spellcheck="false" style="display:none"></textarea>';
  h+='<div id="importBox" style="display:none">';
  h+='<textarea id="importText" spellcheck="false" placeholder="Paste your exported progress JSON here..."></textarea>';
  h+='<div class="syncrow"><button class="btn" onclick="importFromText()">Restore from pasted JSON</button>';
  h+='<label class="btn ghost">Choose file...<input type="file" accept="application/json,.json" style="display:none" onchange="importFromFile(event)"></label></div>';
  h+='<div class="note">Importing replaces the progress stored on this device.</div>';
  h+='</div></div></section>';
  return h;
}
function poolFor(m){ if(!m.quiz) return null; if(m.special==='mock') return QBANK.mock.slice(); let keys = state.mode==='fast'? [m.quiz[0]] : m.quiz; return keys.reduce((a,k)=>a.concat(QBANK[k]),[]); }
function isDone(m){ if(!m.quiz) return !!state.visited[m.id]; return (state.best[m.id]||0)>=70; }
function isPart(m){ return !isDone(m) && (state.visited[m.id]||state.best[m.id]!==undefined); }
function overall(){ let done=MODULES.filter(isDone).length; return Math.round(100*done/MODULES.length); }
function renderNav(){
  const n=document.getElementById('nav');
  let h='<h1>CCA Study App</h1><div class="tag">Claude Certified Architect — Foundations · verified 25 Jul 2026</div>';
  h+='<div id="modeRow"><button class="'+(state.mode==='fast'?'on':'')+'" onclick="setMode(\'fast\')">⚡ Fast track</button><button class="'+(state.mode==='deep'?'on':'')+'" onclick="setMode(\'deep\')">🔍 Deep dive</button></div>';
  h+='<button class="navitem '+(state.view==='dash'?'active':'')+'" onclick="go(\'dash\')"><span class="dot" style="background:var(--acc)"></span>Dashboard</button>';
  for(const m of MODULES){
    const cls=isDone(m)?'done':(isPart(m)?'part':'');
    const sc=state.best[m.id]!==undefined? state.best[m.id]+'%':'';
    h+='<button class="navitem '+(state.view===m.id?'active':'')+'" onclick="go(\''+m.id+'\')"><span class="dot '+cls+'"></span>'+m.title+'<span class="sc">'+sc+'</span></button>';
  }
  h+='<div id="navprog">Overall progress — '+overall()+'%<div class="pbar"><div style="width:'+overall()+'%"></div></div><div style="margin-top:10px">Progress is saved in this browser.<br>Use Export / Import on the Dashboard to move it between devices.</div></div>';
  n.innerHTML=h;
}
function setMode(md){ state.mode=md; save(); renderNav(); render(); }
function go(v){ state.view=v; if(v!=='dash'){state.visited[v]=true; save();} state.quiz=null; renderNav(); render(); window.scrollTo(0,0); }
function render(){ const el=document.getElementById('main'); if(state.view==='dash'){ el.innerHTML=dashHTML(); } else { const m=MODULES.find(x=>x.id===state.view); el.innerHTML=moduleHTML(m); } }
function dashHTML(){
  let h='<h2>Study Dashboard</h2><div class="sub">Built from the verified EY × Anthropic CCA training pack · docs re-verified 25 Jul 2026 (incl. Opus 5, released 24 Jul)</div><div class="domtag">Pass bar: 720/1000 · Mock readiness: ≥80% overall, no domain &lt;70%</div>';
  h+='<section><div class="fastbox"><div class="lbl">How to use</div><b>Fast track</b>: read each module’s 30-second summary, flip the flashcards, take the short quiz (5 Q). <b>Deep dive</b>: adds the full explainer, comparison cards, 10-question quizzes and Week-1 challenge quizzes. Finish with the 60-item mock. A module turns green at ≥70% on its quiz.</div></section>';
  h+='<section><h3 class="sec">Modules — practical first</h3><div class="tiles">';
  for(const m of MODULES){ const st= m.quiz? (state.best[m.id]!==undefined? 'Best: '+state.best[m.id]+'%':'Not attempted') : (state.visited[m.id]?'Read':'Unread'); h+='<div class="tile" onclick="go(\''+m.id+'\')"><h4>'+(isDone(m)?'✅ ':'')+m.title+'</h4><div class="st">'+m.sub+'</div><div class="st">'+st+'</div></div>'; }
  h+='</div></section>';
  if(state.mockDomains){ h+='<section><h3 class="sec">Mock exam — domain diagnostics</h3><div class="dombars">'; for(const d of ['D1','D2','D3','D4','D5']){ const r=state.mockDomains[d]; const pct=Math.round(100*r.c/r.t); const col=pct>=70?'var(--good)':'var(--bad)'; h+='<div class="domrow"><span class="nm">'+d+' — '+DOMNAMES[d]+'</span><div class="bar"><div style="width:'+pct+'%;background:'+col+'"></div></div><span>'+r.c+'/'+r.t+' ('+pct+'%)</span></div>'; } h+='</div><div class="note">Domains under 70%: revisit the matching module, then retake the mock.</div></section>'; }
  h+=syncHTML();
  return h;
}
function moduleHTML(m){
  let h='<h2>'+m.title+'</h2><div class="sub">'+m.sub+'</div><div class="domtag">'+m.dom+'</div>';
  h+='<section><div class="fastbox"><div class="lbl">⚡ 30-second version</div>'+m.fast+'</div></section>';
  h+='<section><details class="deep"'+(state.mode==='deep'?' open':'')+'><summary>🔍 Deep dive — plain-language explainer</summary><div class="body">'+m.deep+'</div></details></section>';
  if(m.comps && m.comps.length){ h+='<section><h3 class="sec">Don’t confuse these</h3>'; for(const c of m.comps){ h+='<div class="comp"><h4>'+c.title+'</h4><div class="compcols">'; for(const col of c.cols){ h+='<div class="compcol"><h5>'+col.h+'</h5><ul>'+col.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>'; } h+='</div></div>'; } h+='</section>'; }
  if(m.cards && m.cards.length){ h+='<section><h3 class="sec">Flashcards</h3><div class="hint">Click a card to flip it.</div><div class="cardgrid">'; m.cards.forEach((c,i)=>{ h+='<div class="fcard" id="fc'+i+'" onclick="this.classList.toggle(\'flip\')"><div class="inner"><div class="fface ffront">'+c.f+'</div><div class="fface fback">'+c.b+'</div></div></div>'; }); h+='</div></section>'; }
  if(m.quiz){ h+='<section><h3 class="sec">'+(m.special==='mock'?'Mock exam':'Self-check quiz')+'</h3><div id="quizArea">'+quizIntroHTML(m)+'</div></section>'; }
  if(m.links && m.links.length){ h+='<section><h3 class="sec">Go deeper — official docs</h3><div class="linkrow">'+m.links.map(l=>'<a href="'+l.u+'" target="_blank" rel="noopener">'+l.t+' ↗</a>').join('')+'</div></section>'; }
  return h;
}
function quizIntroHTML(m){
  const pool=poolFor(m); const n=pool.length;
  let t= m.special==='mock' ? '60 blueprint-weighted items with instant feedback and a per-domain report.' : (state.mode==='fast'? n+' questions (fast track). Switch to Deep dive for the full 10-question set'+(m.challenge?' plus a Week-1 challenge quiz':'')+'.' : n+' questions (deep dive).');
  let h='<div class="quizbox"><div style="font-size:13.5px;margin-bottom:10px">'+t+'</div><button class="btn" onclick="startQuiz(\''+m.id+'\',false)">Start'+(m.special==='mock'?' mock exam':' quiz')+'</button>';
  if(state.mode==='deep' && m.challenge){ h+=' <button class="btn ghost" onclick="startQuiz(\''+m.id+'\',true)">Week-1 challenge quiz (10 Q)</button>'; if(state.chBest[m.id]!==undefined) h+='<span class="note" style="margin-left:10px">Challenge best: '+state.chBest[m.id]+'%</span>'; }
  if(state.best[m.id]!==undefined) h+='<div class="note">Best score: '+state.best[m.id]+'%'+(state.best[m.id]>=70?' — module complete ✅':' — 70% marks it complete')+'</div>';
  return h+'</div>';
}
function startQuiz(mid,ch){ const m=MODULES.find(x=>x.id===mid); const pool= ch? QBANK[m.challenge].slice() : poolFor(m); state.quiz={mid:mid,ch:ch,items:pool,idx:0,correct:0,answered:false,mock:m.special==='mock',domc:{}}; renderQuiz(); }
function renderQuiz(){
  const q=state.quiz; const it=q.items[q.idx];
  let h='<div class="quizbox"><div class="qmeta"><span>Question '+(q.idx+1)+' / '+q.items.length+'</span><span>Score: '+q.correct+'</span></div>';
  h+='<div class="qtext">'+esc(it.q)+'</div>';
  it.opts.forEach((o,i)=>{ h+='<button class="opt" id="opt'+i+'" onclick="answer('+i+')">'+String.fromCharCode(97+i)+') '+esc(o)+'</button>'; });
  h+='<div class="expl" id="expl"></div><button class="btn" id="nextBtn" style="display:none" onclick="nextQ()">'+(q.idx+1===q.items.length?'Finish':'Next')+'</button></div>';
  document.getElementById('quizArea').innerHTML=h;
}
function answer(i){
  const q=state.quiz; if(q.answered) return; q.answered=true; const it=q.items[q.idx];
  const ok = i===it.ans; if(ok) q.correct++;
  if(q.mock && it.dom){ q.domc[it.dom]=q.domc[it.dom]||{c:0,t:0}; q.domc[it.dom].t++; if(ok) q.domc[it.dom].c++; }
  for(let j=0;j<4;j++){ const b=document.getElementById('opt'+j); b.disabled=true; if(j===it.ans) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); }
  const e=document.getElementById('expl'); e.innerHTML=(ok?'✅ Correct. ':'❌ Not quite. ')+esc(it.exp); e.classList.add('show');
  document.getElementById('nextBtn').style.display='inline-block';
}
function nextQ(){
  const q=state.quiz; q.idx++; q.answered=false;
  if(q.idx<q.items.length){ renderQuiz(); return; }
  const pct=Math.round(100*q.correct/q.items.length);
  if(q.ch){ state.chBest[q.mid]=Math.max(state.chBest[q.mid]||0,pct); } else { state.best[q.mid]=Math.max(state.best[q.mid]||0,pct); }
  if(q.mock){ state.mockDomains=q.domc; }
  save();
  let h='<div class="quizbox"><div class="score">'+(pct>=70?'🎉':'📚')+' '+q.correct+' / '+q.items.length+' — '+pct+'%</div>';
  if(q.mock){ h+='<div class="dombars">'; for(const d of ['D1','D2','D3','D4','D5']){ const r=q.domc[d]||{c:0,t:0}; const p=r.t?Math.round(100*r.c/r.t):0; const col=p>=70?'var(--good)':'var(--bad)'; h+='<div class="domrow"><span class="nm">'+d+' — '+DOMNAMES[d]+'</span><div class="bar"><div style="width:'+p+'%;background:'+col+'"></div></div><span>'+r.c+'/'+r.t+'</span></div>'; } h+='</div><div class="note">Readiness bar: ≥80% overall and no domain under 70%. Weak domain → revisit its module, then retake.</div>'; }
  else { h+='<div class="note">'+(pct>=70?'Module complete — it’s green in the nav.':'Under 70% — skim the deep dive and comparison cards, then retry.')+'</div>'; }
  h+='<div style="margin-top:12px"><button class="btn" onclick="startQuiz(\''+q.mid+'\','+q.ch+')">Retry</button> <button class="btn ghost" onclick="go(\''+q.mid+'\')">Back to module</button> <button class="btn ghost" onclick="go(\'dash\')">Dashboard</button></div></div>';
  document.getElementById('quizArea').innerHTML=h; renderNav();
}
load(); renderNav(); render();
</script>
